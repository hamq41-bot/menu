<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>المنيو والمتجر الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#f5a623;
  --primary-15:rgba(245,166,35,.15);
  --primary-25:rgba(245,166,35,.25);
  --bg:#0b0d10;
  --s1:#14171d;
  --s2:#1c2028;
  --s3:#262b36;
  --bd:rgba(255,255,255,.07);
  --tx:#f5f6f8;
  --mu:#8d95a3;
  --ok:#2ecc71;
  --bad:#ef5350;
  --safe-b:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:calc(115px + var(--safe-b));overflow-x:hidden}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--tx);outline:none}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:720px;margin:auto;position:relative}

/* Skeleton Loader */
.skel-box{padding:16px}
.skel{background:linear-gradient(90deg,var(--s1) 25%,var(--s2) 50%,var(--s1) 75%);background-size:200% 100%;animation:shimmer 1.3s infinite;border-radius:16px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Hero & Store Card */
.cover{height:195px;background:linear-gradient(135deg,var(--primary),#151820);position:relative;overflow:hidden}
.cover-img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s ease}
.cover-img.loaded{opacity:1}
.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,16,.35) 0%,rgba(11,13,16,.15) 45%,var(--bg) 100%);pointer-events:none}
.top-acts{position:absolute;top:14px;left:14px;right:14px;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill-btn{background:rgba(11,13,16,.68);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);padding:7px 13px;border-radius:99px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:transform .15s}
.pill-btn:active{transform:scale(.93)}

.head{margin-top:-64px;position:relative;z-index:2;padding:0 14px}
.store-card{background:var(--s1);border:1px solid var(--bd);border-radius:24px;padding:16px 16px 18px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.logo{width:88px;height:88px;border-radius:24px;background:var(--s2);border:3px solid var(--primary);margin:-56px auto 10px;display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden;user-select:none;cursor:pointer;box-shadow:0 10px 25px rgba(0,0,0,.5);transition:transform .2s}
.logo:active{transform:scale(.93)}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:22px;font-weight:900;letter-spacing:-.2px}
.desc{color:var(--mu);font-size:13.5px;margin-top:3px;line-height:1.5}
.meta-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;background:var(--s2);border:1px solid var(--bd)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.badge.on{color:var(--ok);border-color:rgba(46,204,113,.25);background:rgba(46,204,113,.08)}
.badge.on i{background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,204,113,.6)}100%{box-shadow:0 0 0 9px rgba(46,204,113,0)}}

/* Sticky Search & Cats */
.sticky-nav{position:sticky;top:0;z-index:15;background:rgba(11,13,16,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:12px 0 8px;border-bottom:1px solid transparent;transition:border-color .2s}
.sticky-nav.stuck{border-bottom-color:var(--bd)}
.search{padding:0 14px;position:relative}
.search input{width:100%;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:12px 40px 12px 38px;font-size:14px;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-15)}
.s-ico{position:absolute;right:26px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.7;font-size:15px}
.s-clr{position:absolute;left:24px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--s3);color:var(--tx);font-size:12px;display:none;align-items:center;justify-content:center}
.s-clr.show{display:flex}

.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--s1);border:1px solid var(--bd);padding:8px 16px;border-radius:99px;color:var(--mu);font-size:13.5px;font-weight:700;transition:all .2s cubic-bezier(.2,.8,.2,1)}
.chip:active{transform:scale(.94)}
.chip.a{background:var(--primary);color:#111;border-color:var(--primary);box-shadow:0 4px 14px var(--primary-25)}

/* Featured Horizontal Strip */
.sec-t{padding:12px 16px 8px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
.sec-t span{font-size:12px;color:var(--mu);font-weight:600}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 14px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.fcard{flex:none;width:162px;scroll-snap-align:start;background:var(--s1);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .16s}
.fcard:active{transform:scale(.96)}
.fph{height:110px;background:var(--s2);position:relative;display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.fph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.fph img.loaded{opacity:1}
.finfo{padding:10px;display:flex;flex-direction:column;flex:1;gap:4px}
.finfo b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px}

/* Product Grid */
.grid{display:grid;gap:11px;padding:4px 14px}
.card{display:flex;gap:12px;background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:11px;position:relative;cursor:pointer;transition:transform .16s,border-color .2s}
.card.anim{opacity:0;animation:up .42s cubic-bezier(.2,.9,.3,1) forwards}
.card:active{transform:scale(.98)}
.card.in-cart{border-color:var(--primary-25)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ph{width:100px;height:100px;border-radius:15px;background:var(--s2);flex:none;display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s ease}
.ph img.loaded{opacity:1}
.ci{flex:1;display:flex;flex-direction:column;min-width:0}
.ci-top{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.ci b{font-size:15.5px;font-weight:800;line-height:1.35}
.ci small{color:var(--mu);font-size:12.5px;line-height:1.45;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.opt-tag{font-size:11px;color:var(--primary);background:var(--primary-15);padding:2px 8px;border-radius:8px;font-weight:700}
.pop-tag{font-size:11px;color:#ffb74d;background:rgba(255,183,77,.14);padding:2px 8px;border-radius:8px;font-weight:700}
.row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:8px;gap:8px}
.pr-box{display:flex;flex-direction:column}
.old-pr{font-size:11.5px;color:var(--mu);text-decoration:line-through;line-height:1.1}
.pr{color:var(--primary);font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.add{background:var(--primary);color:#111;width:36px;height:36px;border-radius:12px;font-size:21px;font-weight:900;display:flex;align-items:center;justify-content:center;transition:transform .15s;box-shadow:0 4px 12px var(--primary-25);flex:none}
.add:active{transform:scale(.84)}
.add.has-n{width:auto;padding:0 11px;font-size:13.5px;gap:5px}
.c-step{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--primary);border-radius:12px;padding:3px}
.c-step button{width:28px;height:28px;border-radius:9px;background:var(--primary);color:#111;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.c-step button.sub-b{background:var(--s3);color:var(--tx)}
.c-step button:active{transform:scale(.85)}
.c-step span{min-width:18px;text-align:center;font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums}
.out{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(2px);font-size:12px;font-weight:800;color:var(--bad);display:flex;align-items:center;justify-content:center}
.offer{position:absolute;top:6px;right:6px;background:var(--ok);color:#091a10;font-size:10.5px;font-weight:900;padding:2px 7px;border-radius:8px;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.empty{text-align:center;color:var(--mu);padding:46px 16px;background:var(--s1);border:1px dashed var(--bd);border-radius:20px;margin-top:8px}
.foot{text-align:center;margin-top:32px;padding:0 16px;color:var(--mu);font-size:12px;line-height:1.8}
.adm-btn{margin-top:10px;background:var(--s1);color:var(--mu);padding:9px 16px;border-radius:12px;font-size:12px;border:1px solid var(--bd);font-weight:700}

/* Floating Cart Bar */
.bar{position:fixed;bottom:calc(14px + var(--safe-b));left:14px;right:14px;max-width:692px;margin:auto;background:var(--primary);color:#111;border-radius:18px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;font-weight:900;z-index:20;box-shadow:0 14px 34px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.15) inset;cursor:pointer;transition:transform .15s}
.bar:active{transform:scale(.98)}
.bar.show{display:flex}.bar.pop{animation:spring .52s cubic-bezier(.2,.9,.3,1)}
.bar-l{display:flex;align-items:center;gap:10px}
.bar-cnt{background:#111;color:var(--primary);min-width:28px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;padding:0 7px}
.bar-r{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
@keyframes spring{0%{transform:translateY(70px) scale(.92)}55%{transform:translateY(-7px) scale(1.02)}100%{transform:none}}

/* Toast */
.toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-110px);background:var(--s2);border:1px solid var(--primary);padding:11px 18px;border-radius:14px;z-index:120;transition:transform .32s cubic-bezier(.2,.9,.3,1);max-width:92%;text-align:center;font-size:13.5px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.toast.show{transform:translate(-50%,0)}.toast.err{border-color:var(--bad);color:#ffcdd2}

/* Bottom Sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .22s ease;transition:opacity .2s}
.ov.closing{opacity:0}
@keyframes fade{from{opacity:0}}
.sh{background:var(--s1);border-top:1px solid var(--bd);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 18px calc(26px + var(--safe-b));animation:slide .32s cubic-bezier(.2,.95,.3,1);will-change:transform}
.ov.closing .sh{transform:translateY(100%)!important;transition:transform .22s ease}
@keyframes slide{from{transform:translateY(100%)}}
.sh-handle{width:44px;height:5px;border-radius:99px;background:rgba(255,255,255,.22);margin:0 auto 14px;cursor:grab}
.sh h2{font-size:18.5px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.role-tag{font-size:11px;padding:4px 10px;border-radius:99px;background:var(--primary-15);color:var(--primary);font-weight:800}

/* Product Detail Sheet */
.pd-hero{width:100%;height:210px;border-radius:18px;background:var(--s2);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:56px;margin-bottom:12px;position:relative}
.pd-hero img{width:100%;height:100%;object-fit:cover}
.pd-title{font-size:20px;font-weight:900}
.pd-desc{color:var(--mu);font-size:13.5px;line-height:1.6;margin-top:4px}
.opt-row{display:flex;justify-content:space-between;align-items:center;background:var(--s2);padding:12px 14px;border-radius:14px;margin-top:8px;border:1.5px solid var(--bd);cursor:pointer;transition:all .15s}
.opt-row.sel{border-color:var(--primary);background:var(--primary-15)}
.opt-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--mu);margin-left:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.opt-row.sel .opt-radio{border-color:var(--primary)}
.opt-row.sel .opt-radio:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--primary)}
.pd-bar{display:flex;gap:10px;align-items:center;margin-top:16px;position:sticky;bottom:0;background:var(--s1);padding-top:10px;border-top:1px solid var(--bd)}
.pd-qty{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--bd);padding:6px 10px;border-radius:14px}
.pd-qty button{width:32px;height:32px;border-radius:10px;background:var(--s3);font-size:18px;font-weight:800}
.pd-qty b{min-width:20px;text-align:center;font-size:16px}

/* Forms & Controls */
.f{display:block;margin-top:11px}.f span{display:block;color:var(--mu);font-size:12.5px;font-weight:700;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;background:var(--s2);border:1px solid var(--bd);border-radius:13px;padding:11px 13px;transition:border-color .2s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--primary)}
.f input[type=color]{height:46px;padding:4px}
.shake{animation:shake .38s;border-color:var(--bad)!important}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.img-pick{display:flex;gap:8px;align-items:center;margin-top:6px}
.up-lbl{flex:1;position:relative;overflow:hidden;background:var(--s2);border:1px dashed var(--primary);color:var(--primary);padding:11px;border-radius:13px;font-weight:700;font-size:13px;text-align:center;cursor:pointer;display:block}
.up-lbl input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.prev-box{width:54px;height:54px;border-radius:12px;background:var(--s2) center/cover;border:1px solid var(--bd);flex:none}

.btn{width:100%;margin-top:12px;padding:13px;border-radius:14px;background:var(--primary);color:#111;font-weight:900;font-size:15px;transition:transform .14s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.g{background:var(--s2);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:rgba(239,83,80,.15);color:var(--bad);border:1px solid rgba(239,83,80,.25)}

.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:var(--s2);padding:8px 14px;border-radius:12px;color:var(--mu);font-weight:700;font-size:13px;border:1px solid var(--bd)}
.tabs .a{background:var(--primary);color:#111;border-color:var(--primary)}

.li{display:flex;align-items:center;gap:10px;background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-top:8px}
.li-info{flex:1;min-width:0}
.li-info b{font-size:14px;display:block}
.li-note{font-size:11.5px;color:var(--mu);margin-top:2px}
.li-th{width:46px;height:46px;border-radius:11px;background:var(--bg) center/cover;display:flex;align-items:center;justify-content:center;flex:none;font-size:20px;overflow:hidden}
.li-th img{width:100%;height:100%;object-fit:cover}
.sm{padding:6px 10px;border-radius:9px;background:var(--bg);font-size:12px;font-weight:700;border:1px solid var(--bd)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:9px;background:var(--s3);font-size:17px;font-weight:800}

.seg{display:flex;gap:8px;margin-top:12px}
.seg button{flex:1;padding:11px;border-radius:13px;background:var(--s2);border:1px solid var(--bd);font-weight:700;font-size:13.5px}
.seg .a{background:var(--primary);color:#111;border-color:var(--primary)}

.sum-box{background:var(--s2);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-top:14px}
.tot{display:flex;justify-content:space-between;padding:4px 0;color:var(--mu);font-size:13.5px}
.tot.b{color:var(--tx);font-weight:900;font-size:17px;border-top:1px solid var(--bd);margin-top:6px;padding-top:10px}

.linkbox{background:var(--bg);border:1px solid var(--bd);padding:12px;border-radius:12px;word-break:break-all;direction:ltr;text-align:left;margin-top:10px;font-size:12.5px;color:var(--mu)}
.qr-card{background:#fff;color:#111;border-radius:20px;padding:18px;max-width:265px;margin:10px auto;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.qrimg{display:block;margin:0 auto 10px;width:200px;height:200px;border-radius:8px}

.dev-box{margin-top:18px;padding-top:14px;border-top:1px solid var(--bd)}
.size-wrap{margin-top:10px;background:var(--s2);border:1px solid var(--bd);padding:10px 12px;border-radius:12px}
.size-info{font-size:12px;color:var(--mu);display:flex;justify-content:space-between;margin-bottom:6px}
.size-bar{height:7px;background:var(--bg);border-radius:99px;overflow:hidden}
.size-fill{height:100%;background:var(--ok);border-radius:99px;transition:width .3s}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card.anim{opacity:1}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar" onclick="openCart()">
  <div class="bar-l"><span class="bar-cnt" id="bc">0</span><span>عرض السلة</span></div>
  <div class="bar-r"><span id="bt">0 د.ع</span> <span>←</span></div>
</div>
<div class="toast" id="toast"></div>
<div id="sheet"></div>

<script>
const JSONBIN_API_KEY = "via-worker"; // لم يعد هناك مفتاح داخل التطبيق
const BASE = location.origin + location.pathname;
const API = "https://menu-api.hamq41.workers.dev"; // ضع هنا رابط الـWorker بعد نشره
const HAS_KEY = JSONBIN_API_KEY && !JSONBIN_API_KEY.includes("ضع");
const DEFAULT_DEV_PIN = "";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n || 0).toLocaleString("en-US") + " د.ع";
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const getDevPin = () => { try { return localStorage.getItem("sm_dev_pin") || DEFAULT_DEV_PIN; } catch (e) { return DEFAULT_DEV_PIN; } };
const isImgUrl = s => /^(https?:|data:image\/)/.test(String(s || ""));
const vibe = (ms = 12) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
const normAr = s => String(s || "").toLowerCase().replace(/[أإآ]/g, "ا").replace(/ة/g, "ه").replace(/ى/g, "ي").replace(/[\u064B-\u065F]/g, "").trim();

function formatWaPhone(p) {
  let d = String(p || "").replace(/\D/g, "");
  if (/^07\d{9}$/.test(d)) d = "964" + d.slice(1);
  else if (/^7\d{9}$/.test(d)) d = "964" + d;
  return d;
}

const DEF = () => ({
  name: "مطعم النخبة",
  desc: "أشهى الوجبات تصلك ساخنة وبأسرع وقت",
  logo: "🍔",
  cover: "",
  phone: "964770000000",
  eta: "25-35 دقيقة",
  open: true,
  pin: "1234",
  color: "#f5a623",
  cats: ["برغر", "بيتزا", "مشروبات"],
  zones: [{n: "وسط المدينة", p: 2000}, {n: "الأطراف", p: 4000}],
  items: [

function toast(m, err) {

}

function parseOpts(str) {
  if (!str || typeof str !== "string") return [];
  return str.split(/[,،]/).map(s => {
    const idx = s.lastIndexOf(":");
    if (idx === -1) return null;
    const l = s.slice(0, idx).trim();
    const pr = Number(s.slice(idx + 1).replace(/\D/g, ""));
    return l && pr > 0 ? {l, p: pr} : null;
  }).filter(Boolean);
}

function normalize(d) {
  const b = DEF();
  d = d && typeof d === "object" ? d : {};
  const o = Object.assign(b, d);
  o.cats = Array.isArray(o.cats) ? o.cats : [];
  o.zones = Array.isArray(o.zones) ? o.zones : [];
  o.items = Array.isArray(o.items) ? o.items.filter(Boolean) : [];
  if (!o.eta) o.eta = "25-35 دقيقة";
  return o;
}

function headers(extra) {

function hexToRgba(hex, alpha) {
  const h = String(hex || "#f5a623").replace("#", "");
  if (h.length !== 6) return `rgba(245,166,35,${alpha})`;
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function confirmProductAdd() {
  const it = S.items.find(x => x.id === pdState.id);
  if (!it || it.ok === false) return;
  const opts = parseOpts(it.opts);

function addToCart(id, optIdx, note = "", qty = 1) {
  const it = S.items.find(x => x.id === id);
  if (!it || it.ok === false) return;
  const noteSlug = note ? btoa(unescape(encodeURIComponent(note))).slice(0, 12) : "";
  const key = `${id}::${optIdx !== null && optIdx !== undefined ? optIdx : ""}${noteSlug ? "::" + noteSlug : ""}`;
  if (!cart[key]) cart[key] = {id, optIdx, note, n: 0};
  cart[key].n += qty;
  vibe(15);
  saveCart();
  updateBar(true);
  syncCardButtons();
  toast("تمت الإضافة إلى السلة ✓");
}

function cartList() {
  const out = [];
  let changed = false;
  for (const [key, entry] of Object.entries(cart)) {
    if (!entry || !entry.id) { delete cart[key]; changed = true; continue; }
    const it = S.items.find(x => x.id === entry.id);
    if (!it || it.ok === false) continue;
    const opts = parseOpts(it.opts);
    const opt = (entry.optIdx !== null && entry.optIdx !== undefined) ? opts[Number(entry.optIdx)] : null;
    const price = opt ? opt.p : (Number(it.price) || 0);
    const label = opt ? `${it.name} (${opt.l})` : it.name;
    out.push({key, id: it.id, name: label, price, note: entry.note || "", n: entry.n || 1, img: it.img});
  }
  if (changed) saveCart();
  return out;
}

function sub() { return cartList().reduce((a, x) => a + x.price * x.n, 0); }
function delivery() { return ord.type === "d" && S.zones[ord.zone] ? (Number(S.zones[ord.zone].p) || 0) : 0; }

function updateBar(bounce = false) {
  const list = cartList();
  const c = list.reduce((a, x) => a + x.n, 0);
  const b = $("#bar");
  b.classList.toggle("show", c > 0);
  $("#bc").textContent = c;
  $("#bt").textContent = fmt(sub());
  if (bounce && c > 0) {
    b.classList.remove("pop");
    void b.offsetWidth;
    b.classList.add("pop");
  }
}

/* Bottom Sheet Manager (No Flicker + Swipe Down to Close) */
function setSheet(html) {
  const existingBody = $("#sh-body");
  if (existingBody) {
    const sh = $("#sh");
    const st = sh ? sh.scrollTop : 0;
    existingBody.innerHTML = html;
    if (sh) sh.scrollTop = st;
    return;
  }
  $("#sheet").innerHTML = `<div class="ov" id="ov" onclick="if(event.target===this)closeSheet()">
    <div class="sh" id="sh"><div class="sh-handle" id="sh-handle"></div><div id="sh-body">${html}</div></div>
  </div>`;
  attachSheetSwipe();
}

function attachSheetSwipe() {
  const sh = $("#sh");
  if (!sh) return;
  let startY = 0, curY = 0, dragging = false;
  sh.addEventListener("touchstart", e => {
    if (sh.scrollTop <= 0) {
      startY = e.touches[0].clientY;
      curY = 0;
      dragging = true;
    }
  }, {passive: true});
  sh.addEventListener("touchmove", e => {
    if (!dragging) return;
    const dy = e.touches[0].clientY - startY;
    if (dy > 0 && sh.scrollTop <= 0) {
      curY = dy;
      sh.style.transition = "none";
      sh.style.transform = `translateY(${dy}px)`;
    } else if (dy < 0) {
      dragging = false;
      sh.style.transform = "";
    }
  }, {passive: true});
  sh.addEventListener("touchend", () => {
    if (!dragging) return;
    dragging = false;
    sh.style.transition = "";
    if (curY > 95) closeSheet();
    else sh.style.transform = "";
  });
}

function closeSheet() {
  const ov = $("#ov");
  if (!ov) return;
  ov.classList.add("closing");
  setTimeout(() => {
    $("#sheet").innerHTML = "";
    if (adminDirty) {
      adminDirty = false;
      render();
    } else {
      syncCardButtons();
      updateBar();
    }
  }, 200);
}

document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function qty(key, d) {
  if (!cart[key]) return;
  cart[key].n += d;
  if (cart[key].n <= 0) delete cart[key];
  vibe(10);
  saveCart();
  syncCardButtons();
  updateBar();
  openCart();
}

function gps() {
  if (!navigator.geolocation) return toast("المتصفح لا يدعم تحديد الموقع", true);
  toast("جارٍ التقاط إحداثيات موقعك...");
  navigator.geolocation.getCurrentPosition(p => {
    ord.loc = `https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;
    toast("تم إرفاق الموقع بنجاح ✓");
    openCart();
  }, () => toast("تعذر تحديد الموقع، يرجى تفعيل GPS ومنح الإذن", true), {enableHighAccuracy: true, timeout: 12000});
}

function flagErr(sel, msg) {
  const el = $(sel);
  if (el) {
    el.classList.remove("shake");
    void el.offsetWidth;
    el.classList.add("shake");
    el.focus();
  }
  toast(msg, true);
}

function send() {
  if (!S.open) return toast("عذراً، المتجر مغلق حالياً ولا يستقبل الطلبات", true);
  if (!ord.name.trim()) return flagErr("#c_name", "يرجى كتابة اسمك أولاً");
  if (ord.type === "d" && !ord.addr.trim() && !ord.loc) return flagErr("#c_addr", "يرجى كتابة العنوان أو إرفاق موقع GPS");
  if (ord.type === "t" && !String(ord.table).trim()) return flagErr("#c_table", "يرجى كتابة رقم الطاولة أو وقت الاستلام");

  const phone = formatWaPhone(S.phone);
  if (!phone) return toast("رقم واتساب المتجر غير مضبوط", true);

  lsSet("sm_cust", {name: ord.name, addr: ord.addr, type: ord.type, zone: ord.zone});
  const L = cartList(), d = ord.type === "d", z = S.zones[ord.zone];
  const orderNo = Math.floor(1000 + Math.random() * 9000);

  let m = `🛒 *طلب جديد #${orderNo} — ${S.name}*\n━━━━━━━━━━\n👤 *الاسم:* ${ord.name.trim()}\n`;
  m += d
    ? `🛵 *النوع:* توصيل\n📍 *المنطقة:* ${z ? z.n : "-"}\n🏠 *العنوان:* ${ord.addr || "-"}\n${ord.loc ? "🗺️ *الموقع:* " + ord.loc + "\n" : ""}`
    : `🏪 *النوع:* استلام / صالة\n📌 *التفاصيل:* ${ord.table}\n`;
  m += `━━━━━━━━━━\n*الطلبات:*\n` + L.map(x => `▫️ ${x.name} × ${x.n} = ${fmt(x.price * x.n)}${x.note ? `\n   _(ملاحظة: ${x.note})_` : ""}`).join("\n");
  m += `\n━━━━━━━━━━\n💵 المجموع: ${fmt(sub())}\n${d ? "🛵 التوصيل: " + fmt(delivery()) + "\n" : ""}✅ *الإجمالي: ${fmt(sub() + delivery())}*`;
  if (ord.notes && ord.notes.trim()) m += `\n📝 *ملاحظات:* ${ord.notes.trim()}`;

  // حفظ في سجل طلبات الزبون
  const histKey = "sm_orders_" + storeKey();
  const hist = lsGet(histKey, []);
  hist.unshift({no: orderNo, date: new Date().toLocaleString("ar-IQ"), total: sub() + delivery(), items: cart});
  lsSet(histKey, hist.slice(0, 10));

  vibe(25);
  window.open("https://wa.me/" + phone + "?text=" + encodeURIComponent(m), "_blank");

function downloadQR() {
  const img = $("#qri");
  if (!img) return;
  if (!img.complete || !img.naturalWidth) return toast("يرجى الانتظار لحظة حتى يكتمل تحميل رمز QR", true);
  try {
    const c = document.createElement("canvas");
    c.width = 500; c.height = 640;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, 500, 640);
    ctx.fillStyle = S.color || "#f5a623"; ctx.fillRect(0, 0, 500, 22);
    ctx.drawImage(img, 75, 55, 350, 350);
    ctx.fillStyle = "#111111"; ctx.font = "bold 30px Cairo, sans-serif"; ctx.textAlign = "center";
    ctx.fillText(S.name, 250, 468);
    ctx.fillStyle = "#555555"; ctx.font = "600 19px Cairo, sans-serif";
    ctx.fillText("امسح الكود بكاميرا الهاتف للطلب المباشر", 250, 518);
    const a = document.createElement("a");
    a.download = "QR-" + (S.name || "store") + ".png";
    a.href = c.toDataURL("image/png");
    a.click();
    toast("تم تحميل بطاقة QR ✓");
  } catch (e) {
    toast("اضغط مطولاً على صورة الباركود لحفظها", true);
  }
}

/* Image Compression (WebP with transparent support + JPEG fallback) */
function handleFile(inp, targetId, maxW, maxH, isStoreKey) {
  const file = inp.files && inp.files[0];
  if (!file) return;
  toast("جارٍ تجهيز وضغط الصورة...");
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      let w = img.width, h = img.height;
      const ratio = Math.min(maxW / w, maxH / h, 1);
      w = Math.max(1, Math.round(w * ratio));
      h = Math.max(1, Math.round(h * ratio));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      let dataUrl = c.toDataURL("image/webp", 0.72);
      if (!dataUrl.startsWith("data:image/webp")) dataUrl = c.toDataURL("image/jpeg", 0.65);
      adminDirty = true;
      if (isStoreKey) {
        S[targetId] = dataUrl;
        persistLocal();
        adminView();
      } else {
        const el = $("#" + targetId);
        if (el) el.value = dataUrl;
        const prev = $("#prev_" + targetId);
        if (prev) { prev.style.backgroundImage = `url('${dataUrl}')`; prev.style.display = "block"; }
      }
      toast("تم رفع الصورة بنجاح ✓");
    };
    img.onerror = () => toast("تعذر قراءة الصورة", true);
    img.src = e.target.result;
  };
  reader.onerror = () => toast("تعذر فتح الصورة", true);
  reader.readAsDataURL(file);
}

function editItemView(id) {

  <div class="f"><span>صورة المنتج</span>
    <div class="img-pick">

      <div class="prev-box" id="prev_e_img" style="${it.img ? `background-image:url('${esc(it.img)}')` : "display:none"}"></div>
      ${it.img ? `<button type="button" class="sm" style="color:var(--bad)" onclick="clearEditImg()">حذف</button>` : ""}
    </div>
    <input id="e_img" type="${imgIsData ? "hidden" : "text"}" style="margin-top:6px" value="${esc(it.img || "")}" placeholder="أو رابط صورة جاهز">

  <button class="btn" data-id="${esc(id)}" onclick="saveEditItem(this.dataset.id)">💾 حفظ التعديلات</button>

function saveEditItem(id) {

document.addEventListener("input", e => {

function addItem() {

async function publish() {
  const b = $("#pubBtn");

  b.textContent = "جارٍ الحفظ...";
  persistLocal();
  const payload = JSON.stringify(S);
  if (payload.length > 98000) {

    return;
  }
  try {
    if (!HAS_KEY) {
      lsSet("sm_local", S);
      toast("تم الحفظ محلياً ✓");
    } else if (binId) {
      const r = await fetch(API + "/" + binId, {method: "PUT", headers: headers(), body: payload});
      if (!r.ok) throw new Error(r.status);
      toast("تم حفظ التعديلات على السحابة ✓");
    } else if (isDev) {
      const r = await fetch(API, {method: "POST", headers: headers({"X-Bin-Private": "false", "X-Bin-Name": "store-" + Date.now()}), body: payload});
      if (!r.ok) { let t = ""; try { t = (await r.json()).message || ""; } catch (x) {} throw new Error(r.status + " " + t); }
      binId = (await r.json()).metadata.id;
      lsSet("sm_cache_" + binId, S);
      loadCart();
      history.replaceState(null, "", "?id=" + binId);
      toast("تم نشر المتجر وتوليد الرابط ✓");
    } else {
      lsSet("sm_local", S);
      toast("تم حفظ التعديلات محلياً ✓");
    }
    if (isDev && $("#pubOut")) {
      $("#pubOut").innerHTML = HAS_KEY ? linkUI() : `<div class="linkbox">لا يوجد رابط سحابي.</div>`;
    }
  } catch (e) {
    toast("فشل الحفظ: " + e.message, true);
  }
  b.disabled = false;
  b.textContent = isDev ? "💾 حفظ ونشر رابط المتجر القصير" : "💾 حفظ التعديلات على متجري";
}

function copyLink() {
  const l = shareLink();
  (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(() => toast("تم نسخ الرابط ✓"), () => {
    const r = document.createRange(); r.selectNode($("#lk")); getSelection().removeAllRanges(); getSelection().addRange(r);

}

function resetStore() {

  loadCart();
  tab = 0;
  adminView();
  toast("تم التفريغ، ابدأ بتعبئة بيانات المتجر");
}

<script>
/* ===== أدوات ===== */
const hp=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
let lp={x:innerWidth/2,y:innerHeight/2},_pc=0,_lr=0,_fails=0,_lock=0;

/* ===== أمان: لا يُنشر الرمز السري صريحاً في السحابة ===== */
const _norm=normalize;
normalize=d=>{const o=_norm(d);if(o.pinH)o.pin="";return o};
/* ===== الاتصال بالـWorker: المفتاح والرموز على السيرفر وليس في الكود ===== */
let devKey="",ownPin="",pinTouched=false;
const api=async(path,method,body,hd)=>{
  if(API.includes("YOUR-WORKER"))throw new Error("اضبط رابط الـWorker في سطر API أولاً");
  const r=await fetch(API+path,{method,headers:{"Content-Type":"application/json",...(hd||{})},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error==="locked"?"محاولات كثيرة، انتظر 10 دقائق":j.error==="denied"?"غير مصرّح":j.error==="pin_short"?"الرمز السري 4 خانات على الأقل":j.error==="too_large"?"حجم البيانات كبير جداً":(j.error||r.status));
  return j;
};
document.addEventListener("input",e=>{if(e.target.dataset&&e.target.dataset.k==="pin")pinTouched=true});
load=async function(){
  const id=new URLSearchParams(location.search).get("id");
  if(id&&id!=="local"){
    binId=id;renderSkeleton();
    try{
      if(API.includes("YOUR-WORKER"))throw new Error("no worker");
      const r=await fetch(API+"/s/"+id);if(!r.ok)throw new Error(r.status);
      S=normalize(await r.json());S.pin="";lsSet("sm_cache_"+id,S);
    }catch(e){
      const c=lsGet("sm_cache_"+id,null);
      if(c){S=normalize(c);S.pin="";toast("تعذر الاتصال بالسحابة، تم عرض آخر نسخة محفوظة",true)}
      else toast("تعذر تحميل المتجر. تأكد من صحة الرابط أو الإنترنت",true);
    }
  }else S=normalize(lsGet("sm_local",null));
  loadCart();if(ord.zone>=S.zones.length)ord.zone=0;render();
};
checkPin=async function(){
  const v=(($("#pin")||{}).value||"").trim();
  if(!v)return flagErr("#pin","اكتب الرمز السري");
  try{
    const r=await api("/auth","POST",{pin:v,id:binId});
    if(r.role==="dev"){isDev=true;devKey=v}else{isDev=false;ownPin=v}
    tab=0;adminView();
  }catch(e){flagErr("#pin",e.message==="غير مصرّح"?"الرمز السري غير صحيح":e.message)}
};
const _av=adminView;
adminView=function(){
  _av();
  document.querySelectorAll(".dev-box").forEach(e=>{e.innerHTML='<div class="desc">رمز المطور يُضبط من إعدادات Cloudflare (DEV_KEY) ولا يُخزَّن في التطبيق.</div>'});
  const pn=document.querySelector('[data-k="pin"]');
  if(pn)pn.placeholder=binId?"اتركه فارغاً للإبقاء على الرمز الحالي":"رمز صاحب المتجر (4 خانات فأكثر)";
  const kb=Math.round(JSON.stringify(S).length/1024),pc=Math.min(100,Math.round(kb/400*100));
  const sb=document.querySelector(".size-info b");if(sb)sb.textContent=`${kb} / 400 KB (${pc}%)`;
  const sf=document.querySelector(".size-fill");
  if(sf){sf.style.width=pc+"%";sf.style.background=pc>85?"var(--bad)":pc>65?"#f5a623":"var(--ok)"}
};
publish=async function(){
  const b=$("#pubBtn"),lbl=isDev?"💾 حفظ ونشر رابط المتجر القصير":"💾 حفظ التعديلات على متجري";
  if(!binId&&isDev&&!pinTouched)return toast("حدّد رمزاً سرياً لصاحب المتجر في تبويب هوية المتجر أولاً",true);
  b.disabled=true;b.textContent="جارٍ الحفظ...";persistLocal();
  const data=JSON.parse(JSON.stringify(S));delete data.pin;delete data.pinH;
  try{
    if(JSON.stringify(data).length>400000)throw new Error("حجم الصور كبير، قلل عدد الصور");
    if(binId){
      await api("/s/"+binId,"PUT",{data,ownerPin:isDev&&pinTouched&&S.pin?S.pin:undefined},isDev?{"X-Dev-Key":devKey}:{"X-Owner-Pin":ownPin});
      toast("تم حفظ التعديلات على السحابة ✓");
    }else if(isDev){
      const r=await api("/s","POST",{data,ownerPin:S.pin},{"X-Dev-Key":devKey});
      binId=r.id;lsSet("sm_cache_"+binId,S);loadCart();history.replaceState(null,"","?id="+binId);
      toast("تم نشر المتجر وتوليد الرابط ✓");
    }else throw new Error("غير مصرّح");
    pinTouched=false;
    if(isDev&&$("#pubOut"))$("#pubOut").innerHTML=linkUI();
  }catch(e){toast("فشل الحفظ: "+e.message,true)}
  b.disabled=false;b.textContent=lbl;
};
const _rst=resetStore;
resetStore=function(){_rst();pinTouched=false};


/* ===== إصلاح: الشيت يُمسح أثناء فتح شيت جديد ===== */
const _ss=setSheet;
setSheet=h=>{const o=$("#ov");if(o&&o.classList.contains("closing"))$("#sheet").innerHTML="";_ss(h)};
closeSheet=function(){

/* ===== إصلاح: ملاحظات متشابهة كانت تندمج في سطر واحد ===== */
addToCart=function(id,optIdx,note="",qty=1,ex){
  const it=S.items.find(x=>x.id===id);if(!it||it.ok===false)return;
  const key=`${id}::${optIdx==null?"":optIdx}${ex&&ex.length?"::x"+ex.join("."):""}${note?"::"+hp(note):""}`;
  if(!cart[key])cart[key]={id,optIdx,note,n:0,ex:ex||[]};

  toast("تمت الإضافة إلى السلة ✓");fly();
};

/* ===== حيوية: ripple + طيران المنتج للسلة + عدّاد ===== */
function ripple(e){
  const t=e.target.closest&&e.target.closest(".add,.btn,.chip,.pill-btn,.opt-row,.sm");if(!t)return;
  const r=t.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,d=document.createElement("span");
  d.className="rip";d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
  t.appendChild(d);setTimeout(()=>d.remove(),600);
}
addEventListener("pointerdown",e=>{lp={x:e.clientX,y:e.clientY};ripple(e)},true);
function fly(){
  const b=$("#bc");if(!b||!b.animate)return;
  const r=b.getBoundingClientRect(),d=document.createElement("i"),x=r.left+r.width/2-8,y=r.top+r.height/2-8;
  d.className="fly";document.body.appendChild(d);
  d.animate([
    {transform:`translate(${lp.x-8}px,${lp.y-8}px) scale(1)`,opacity:1},
    {transform:`translate(${(lp.x+x)/2}px,${Math.min(lp.y,y)-70}px) scale(1.2)`,opacity:1,offset:.5},
    {transform:`translate(${x}px,${y}px) scale(.3)`,opacity:.4}
  ],{duration:650,easing:"cubic-bezier(.4,0,.2,1)"}).onfinish=()=>d.remove();
}
const _ub=updateBar;
updateBar=function(b){
  _ub(b);const e=$("#bc"),c=+e.textContent;

/* ===== ظهور البطاقات عند التمرير ===== */
const _rg=renderGrid;
renderGrid=function(a){
  _rg(a);
  const cs=[...document.querySelectorAll(".card.anim")];if(!cs.length)return;
  if(!("IntersectionObserver" in window)){cs.forEach(c=>c.classList.add("go"));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("go");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px"});

};
addEventListener("scroll",()=>{const i=document.querySelector(".cover-img");if(i&&scrollY<300)i.style.setProperty("--py",Math.min(scrollY*.2,22)+"px")},{passive:true});
const _sc=setCat;

/* ===== السلة: تنبيه المتجر المغلق ===== */
const _oc=openCart;
openCart=function(){
  _oc();
  if(!(S.open&&inHours())){const b=$("#sh-body");if(b)b.insertAdjacentHTML("afterbegin",`<div class="empty" style="margin:0 0 10px;padding:10px;color:var(--bad)">المتجر مغلق حالياً، جهّز سلتك وأرسلها عند الفتح</div>`)}
};

/* ===== نجاح الطلب: شاشة متحركة + كونفيتي + تفريغ السلة ===== */
const _send=send;
send=function(){
  const hk="sm_orders_"+storeKey(),sig=o=>o?o.no+o.date:"",before=sig(lsGet(hk,[])[0]);
  const ow=window.open;let url="";
  window.open=function(u){url=u;return ow.apply(window,arguments)};
  const raw=_sub();
  if(+S.minOrder>0&&raw<+S.minOrder){window.open=ow;return toast("الحد الأدنى للطلب "+fmt(+S.minOrder),true)}
  const so=S.open,sn=ord.notes;S.open=so&&inHours();
  const ex=[],cd=couponDisc();
  if(cd>0)ex.push("🎟 كوبون "+ord.coupon+": خصم "+fmt(cd));
  if(ord.pay)ex.push("💳 الدفع: "+ord.pay);
  if(ex.length)ord.notes=((sn||"").trim()?sn.trim()+"\n":"")+ex.join("\n");
  try{_send()}finally{window.open=ow;S.open=so;ord.notes=sn}
  const h=lsGet(hk,[])[0];
